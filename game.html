const canvas=document.getElementById('world'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),content=document.getElementById('content'),joy=document.getElementById('joy'),knob=document.getElementById('knob');let save={active:null,done:{}};try{let x=JSON.parse(localStorage.getItem('travelQuest_v3'));if(x&&x.done)save=x}catch(e){}let hero={x:510,y:430},v={x:0,y:0},keys={},near=null,cam={x:0,y:0,scale:1},last=0,phase=0,w=0,h=0;

function close(){overlay.hidden=true}function panel(markup){content.innerHTML=markup;overlay.hidden=false}function escapeText(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function questMenu(){let blocks=quests.map((q,i)=>{let n=(save.done[i]||[]).length;return '<button class="quest-button" data-q="'+i+'"><b>'+q.day+' · '+escapeText(q.title)+'</b><span>'+n+'/'+q.steps.length+' 個目標'+(i===save.active?' · 進行中':'')+'</span></button>'}).join('');panel('<small>YOUR JOURNEY</small><h2 id="panelTitle">每日任務</h2><p>選一天查看行程，也能隨時切換任務。</p><div class="grid">'+blocks+'</div><button class="secondary" id="back">返回選單</button>');content.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>questDetail(+b.dataset.q));document.getElementById('back').onclick=mainMenu}

function poly(points,col){ctx.fillStyle=col;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill()}
