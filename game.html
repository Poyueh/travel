<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>泊月的東日本探險</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1821;color:#f6eee0;font:15px/1.5 system-ui,sans-serif}main{max-width:940px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(22px,5vw,36px);margin:0;letter-spacing:.04em}small{color:#e6be83;letter-spacing:.14em;font-size:10px;font-weight:800}a{color:#b3e7db}.subtitle{color:#a9c5bf;margin:4px 0 12px}.frame{position:relative;border:1px solid #dcb97c;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px #0008;background:#6f9a71;touch-action:none}canvas{display:block;width:100%;height:auto;aspect-ratio:800/540;touch-action:none}.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill{background:#142a30dd;border:1px solid #ffffff30;padding:7px 11px;border-radius:99px;font-size:12px;box-shadow:0 4px 14px #0004}.hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#102b2ae8;padding:8px 13px;border-radius:99px;font-size:12px;white-space:nowrap}.play-controls{display:flex;justify-content:space-between;align-items:center;max-width:510px;margin:16px auto 0;gap:20px}.joystick{width:134px;height:134px;border-radius:50%;background:#283f43;border:2px solid #839d8b;position:relative;touch-action:none;box-shadow:inset 0 4px 20px #0006}.joystick:before{content:'';position:absolute;inset:22px;border:1px dashed #ffffff35;border-radius:50%}.knob{position:absolute;width:58px;height:58px;left:36px;top:36px;border-radius:50%;background:linear-gradient(#f5d9a0,#b89059);box-shadow:0 5px 13px #0007;pointer-events:none}.action{width:98px;height:98px;border-radius:50%;border:3px solid #f6dca2;background:#d49c58;color:#263735;font-size:17px;font-weight:800;box-shadow:0 8px 0 #896133,0 12px 22px #0006;cursor:pointer}.action:active{transform:translateY(4px);box-shadow:0 4px 0 #896133}button{font:inherit;cursor:pointer}.footer{text-align:center;color:#a9beb6;font-size:13px}.locations{display:flex;gap:8px;overflow:auto;padding:10px 0}.locations button{flex:none;border:1px solid #547271;background:#1d353c;color:#f8e9cf;border-radius:20px;padding:8px 12px}dialog{border:1px solid #d4ac6d;background:#f5eedc;color:#263b35;border-radius:18px;max-width:480px;width:calc(100% - 30px);padding:24px;box-shadow:0 20px 80px #0009}dialog::backdrop{background:#071515ba}dialog h2{margin:6px 0;font-size:28px}dialog p{line-height:1.8}dialog small{color:#9b6339}dialog a{color:#136a64;font-weight:bold}dialog button{float:right;border:0;background:#245f55;color:white;padding:10px 16px;border-radius:9px}.toast{color:#eacb95}
</style></head><body><main><header><div><small>JAPAN TRAVEL JOURNAL · 2026</small><h1>泊月的東日本探險</h1></div><a href="./index.html">📖 旅遊手冊</a></header><p class="subtitle">拖曳搖桿探索，靠近景點按「互動」收集旅行印章。</p><div class="frame"><canvas id="map" width="800" height="540" aria-label="旅程遊戲地圖"></canvas><div class="hud"><span class="pill">✦ 旅程探索</span><span class="pill" id="count"></span></div><div class="hint" id="hint">移動角色開始旅行</div></div><div class="play-controls"><div class="joystick" id="joy" role="application" aria-label="虛擬搖桿，拖曳移動角色"><div class="knob" id="knob"></div></div><button class="action" id="action">互動 ✦</button></div><p class="footer">拖曳搖桿移動・靠近建築後互動<br>電腦可使用方向鍵或 WASD，空白鍵互動</p><div class="locations" id="places"></div><p class="footer">這是想像中的旅行地圖；車次、營業時間及劃位狀態以官方與實際預約為準。</p></main><dialog id="dialog"><small id="date"></small><h2 id="name"></h2><p id="desc"></p><a id="link">查看手冊詳細行程 →</a><button id="close">繼續探索</button></dialog><script>
const locations=[{x:115,y:135,icon:'⛩️',name:'神田明神',date:'11/10 · 東京',desc:'上午神田明神與秋葉原，下午可選私人安排或觀光備案。',id:'d2'},{x:300,y:135,icon:'☕',name:'蕾潔咖啡廳',date:'11/11 · 神保町',desc:'探訪粉絲推測的蕾潔場景，午後前往中野百老匯；營業狀態請再確認。',id:'d3'},{x:500,y:135,icon:'⛵',name:'松島',date:'11/12 · 宮城',desc:'新幹線至仙台，轉仙石線探索松島。去回程指定席與接駁都要確認。',id:'d4'},{x:685,y:135,icon:'♨️',name:'彌彥',date:'11/13 · 新潟',desc:'彌彥神社、紅葉與溫泉。記得留意回燕三條的新幹線接續。',id:'d5'},{x:115,y:400,icon:'🏮',name:'川越',date:'11/14 · 埼玉',desc:'方案 A 川越加展覽；方案 B 川越一日慢遊，兩種方案可自行選擇。',id:'d6'},{x:300,y:400,icon:'🍁',name:'山寺',date:'11/15 · 山形',desc:'登上石階，欣賞古寺與山谷；穿好走的鞋，雨後小心石階濕滑。',id:'d7'},{x:500,y:400,icon:'🌰',name:'長野小布施',date:'11/16 · 長野',desc:'善光寺、北齋與栗子小鎮。回程新幹線尚待選定，長野電鐵不包含在 JR PASS。',id:'d8'},{x:685,y:400,icon:'🛎️',name:'上野旅宿',date:'11/9—11/18 · 東京',desc:'APA 上野御徒町站前南是旅程基地；入住資料以訂房確認信為準。',id:'overview'}];
const cvs=document.getElementById('map'),ctx=cvs.getContext('2d'),dlg=document.getElementById('dialog'),joy=document.getElementById('joy'),knob=document.getElementById('knob');let seen;try{seen=new Set(JSON.parse(localStorage.getItem('japanquest_visited')||'[]'))}catch(e){seen=new Set()}let hero={x:400,y:270},vec={x:0,y:0},keys={},closest=null,last=0,phase=0;
function rounded(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(t){ctx.clearRect(0,0,800,540);const bg=ctx.createLinearGradient(0,0,0,540);bg.addColorStop(0,'#b9d398');bg.addColorStop(1,'#84ac7c');ctx.fillStyle=bg;ctx.fillRect(0,0,800,540);ctx.strokeStyle='#e7d8aa';ctx.lineWidth=86;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,270);ctx.lineTo(800,270);ctx.moveTo(205,0);ctx.lineTo(205,540);ctx.moveTo(595,0);ctx.lineTo(595,540);ctx.stroke();ctx.strokeStyle='#f7e9c0';ctx.lineWidth=2;ctx.setLineDash([8,12]);ctx.beginPath();ctx.moveTo(0,270);ctx.lineTo(800,270);ctx.stroke();ctx.setLineDash([]);
for(let i=0;i<35;i++){let x=(i*173+27)%800,y=(i*119+23)%540;if(Math.abs(y-270)<60||Math.abs(x-205)<55||Math.abs(x-595)<55)continue;ctx.fillStyle=i%2?'#618e64':'#739d68';ctx.beginPath();ctx.arc(x,y,7+i%5,0,7);ctx.fill();ctx.fillStyle='#f1dcaa';ctx.fillRect(x-2,y+8,4,9)}
locations.forEach((p,i)=>{ctx.fillStyle='#223d3244';ctx.beginPath();ctx.ellipse(p.x,p.y+45,60,15,0,0,7);ctx.fill();rounded(p.x-48,p.y-19,96,62,8,'#fff0d5');rounded(p.x-37,p.y-7,20,20,4,'#76b2b3');rounded(p.x+17,p.y-7,20,20,4,'#76b2b3');rounded(p.x-9,p.y+9,18,34,3,'#92644b');ctx.fillStyle=['#b45d4e','#b87853','#698f80','#a35f50'][i%4];ctx.beginPath();ctx.moveTo(p.x-57,p.y-19);ctx.lineTo(p.x,p.y-56);ctx.lineTo(p.x+57,p.y-19);ctx.closePath();ctx.fill();ctx.font='26px sans-serif';ctx.textAlign='center';ctx.fillText(p.icon,p.x,p.y-28);rounded(p.x-56,p.y+52,112,25,12,'#173d39e8');ctx.fillStyle='#fff4df';ctx.font='bold 14px system-ui';ctx.fillText(p.name,p.x,p.y+69);if(seen.has(i)){ctx.fillStyle='#ffe099';ctx.font='bold 19px sans-serif';ctx.fillText('✦',p.x+43,p.y-43)}});
const walking=Math.abs(vec.x)+Math.abs(vec.y)>0||Object.values(keys).some(Boolean);let bounce=walking?Math.sin(phase)*3:0;ctx.fillStyle='#203b3544';ctx.beginPath();ctx.ellipse(hero.x,hero.y+17,15,6,0,0,7);ctx.fill();rounded(hero.x-10,hero.y+3+bounce,20,17,5,'#354e72');rounded(hero.x-11,hero.y-10+bounce,22,19,7,'#f2c9a4');ctx.fillStyle='#3d3430';ctx.beginPath();ctx.arc(hero.x,hero.y-9+bounce,12,Math.PI,0);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(hero.x+3,hero.y-3+bounce,3,3);
closest=null;let best=93;locations.forEach((p,i)=>{let d=Math.hypot(hero.x-p.x,hero.y-p.y);if(d<best){best=d;closest=i}});document.getElementById('hint').textContent=closest===null?'探索地圖，靠近建築': '✦ '+locations[closest].name+'：按互動';document.getElementById('count').textContent='旅行印章 '+seen.size+' / '+locations.length;
let dt=Math.min((t-last)/1000,.04)||0;last=t;let dx=vec.x+(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),dy=vec.y+(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);let m=Math.hypot(dx,dy);if(m&&!dlg.open){hero.x=Math.max(15,Math.min(785,hero.x+dx/Math.max(1,m)*145*dt));hero.y=Math.max(20,Math.min(520,hero.y+dy/Math.max(1,m)*145*dt));phase+=dt*12}requestAnimationFrame(draw)}
function open(i){if(i==null)return;let p=locations[i];seen.add(i);try{localStorage.setItem('japanquest_visited',JSON.stringify([...seen]))}catch(e){}document.getElementById('date').textContent=p.date;document.getElementById('name').textContent=p.icon+' '+p.name;document.getElementById('desc').textContent=p.desc;let a=document.getElementById('link');a.href='./index.html#'+p.id;dlg.showModal()}
function stick(e){let r=joy.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),limit=r.width*.32,d=Math.hypot(x,y);if(d>limit){x=x/d*limit;y=y/d*limit}vec.x=x/limit;vec.y=y/limit;knob.style.transform='translate('+x+'px,'+y+'px)'}
joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);stick(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))stick(e)});function reset(){vec.x=vec.y=0;knob.style.transform=''}joy.addEventListener('pointerup',reset);joy.addEventListener('pointercancel',reset);joy.addEventListener('lostpointercapture',reset);window.addEventListener('blur',()=>{keys={};reset()});document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d',' '].includes(k))e.preventDefault();keys[k]=true;if(k===' '&&!e.repeat&&!dlg.open)open(closest)});document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.getElementById('action').onclick=()=>open(closest);document.getElementById('close').onclick=()=>dlg.close();locations.forEach((p,i)=>{let b=document.createElement('button');b.textContent=p.icon+' '+p.name;b.onclick=()=>open(i);document.getElementById('places').appendChild(b)});requestAnimationFrame(draw);
</script></body></html>
