function travelPrep(){panel('<h2 id="panelTitle">🚅 出發準備</h2><p><b>11/10 上野站：</b>帶護照正本、KKday 兌換券及 JR 預約資料，換 11/12–16 周遊券，請站員領全部已訂指定席。每班須乘車前一日 21:00 前取票。</p><p><b>11/12 仙台：</b>去 06:38 → 08:03 已完成；回 21:31 → 22:58，已出現在預約列表。松島遊船可現場買，想固定班次可預約。</p><p><b>11/13 彌彥：</b>去 07:10 → 08:43、回 21:52 → 23:34 已預約；燕三條晚餐，21:15 左右到站。紅葉谷和菊祭免費。</p><p><b>11/14：</b>川越 JR 普通車不用劃位；Design Festa 可選，11/13 前預售 ¥800，現場 ¥1,000。</p><p><b>11/15 山形：</b>去 07:18 → 09:53 已完成；回程 19:31 → 22:18 已出現在預約列表。山寺入山 ¥500，準備現金。</p><p><b>11/16 長野：</b>去 07:58 → 09:30、回 20:37 → 22:06，兩段均已出現在預約列表。長野電鐵另付；北齋館 16:30 前入場。</p><p><b>禮盒：</b>11/10 優先、11/17 備案，東京站，東京站八重洲北口東京ギフトパレット茶織屋，帶 KKday 禮盒兌換券並確認營業及兌換期限。兩天 JR PASS 均不生效，搭 JR 用 ICOCA。</p><a href="./index.html#latest20261108">📖 查看完整更新</a><button id="prepback">返回選單</button>');document.getElementById('prepback').onclick=mainMenu}
