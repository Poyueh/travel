function stick(e){let r=joy.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),limit=r.width*.3,d=Math.hypot(x,y);if(d>limit){x=x/d*limit;y=y/d*limit}v.x=x/limit;v.y=y/limit;knob.style.transform='translate('+x+'px,'+y+'px)'}function reset(){v.x=0;v.y=0;knob.style.transform=''}
joy.addEventListener('pointerdown',e=>{e.preventDefault();joy.setPointerCapture(e.pointerId);stick(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))stick(e)});['pointerup','pointercancel','lostpointercapture'].forEach(a=>joy.addEventListener(a,reset));window.addEventListener('blur',()=>{keys={};reset()});document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys[k]=true;if((k===' '||k==='e')&&!e.repeat&&overlay.hidden)interact();if(k==='escape')close()});document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.getElementById('menu').onclick=mainMenu;document.getElementById('act').onclick=interact;requestAnimationFrame(draw);if(save.active===null)mainMenu();
