<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>泊月的日本旅程 RPG</title><style>
*{box-sizing:border-box}body{margin:0;background:#122632;color:#f8f0d6;font-family:system-ui,sans-serif}main{max-width:880px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:clamp(22px,5vw,34px);margin:4px 0}p{line-height:1.6}.sub{color:#bcd5cc;font-size:14px}a{color:#a3efdb}.world{border:5px solid #c5a66c;border-radius:12px;overflow:hidden;box-shadow:0 12px 35px #0008;background:#7cab69}canvas{display:block;width:100%;height:auto;touch-action:none;image-rendering:pixelated}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0;flex-wrap:wrap}.badge{background:#263e42;border-radius:9px;padding:8px 12px}.controls{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center;touch-action:none}.controls button,button{font:700 16px system-ui;border:0;border-radius:9px;background:#e4c78e;color:#213830;cursor:pointer}.controls button:active{background:#9ddbc4}.controls button:nth-child(1){grid-column:2}.controls button:nth-child(2){grid-column:1;grid-row:2}.controls button:nth-child(3){grid-column:2;grid-row:2}.controls button:nth-child(4){grid-column:3;grid-grid-row:2;grid-row:2}.interact{padding:12px 20px;background:#a2dec6}.bottom{display:flex;justify-content:center;gap:25px;align-items:center;margin:12px 0}dialog{border:2px solid #d3ac68;border-radius:14px;background:#182f36;color:#f6efdf;max-width:520px;width:calc(100% - 32px);padding:24px}dialog::backdrop{background:#000b}dialog h2{margin:4px 0 12px}dialog button{padding:10px 15px}dialog a{display:inline-block;padding:10px}.destinations{display:flex;gap:8px;flex-wrap:wrap}.destinations button{padding:8px 10px;font-size:13px;background:#304c4b;color:#fff}
</style></head><body><main><header><div><small>POYUEH’S JAPAN QUEST · 2026</small><h1>泊月的日本旅程 RPG</h1></div><a href="./index.html">📖 旅遊手冊</a></header><p class="sub">用方向鍵或下方按鈕移動，走近建築後按「查看」。這是旅途的想像地圖，不代表實際地理位置。</p><div class="toolbar"><span class="badge" id="prompt">向前探索吧！</span><span class="badge" id="progress"></span></div><div class="world"><canvas id="game" width="800" height="510" aria-label="日本旅途探索地圖"></canvas></div><div class="bottom"><div class="controls" aria-label="移動方向"><button data-x="0" data-y="-1" aria-label="向上">▲</button><button data-x="-1" data-y="0" aria-label="向左">◀</button><button data-x="0" data-y="1" aria-label="向下">▼</button><button data-x="1" data-y="0" aria-label="向右">▶</button></div><button class="interact" id="interact">查看 ✦</button></div><p class="sub">也可以直接點選地點，或用鍵盤方向鍵／WASD 移動、空白鍵查看。</p><div class="destinations" id="dest"></div><p class="sub">行程時刻與座位仍以官方與你的預約紀錄為準。探索紀錄只儲存在這台裝置。</p></main><dialog id="info"><small id="date"></small><h2 id="title"></h2><p id="description"></p><a id="link" href="./index.html">📖 查看手冊詳情 →</a><button id="close">繼續旅行</button></dialog><script>
const places=[
{x:110,y:115,icon:'⛩️',name:'神田明神',date:'11/10 · 秋葉原',desc:'上午拜訪神田明神與秋葉原，下午可選私人安排或觀光備案。',id:'d2'},
{x:310,y:110,icon:'☕',name:'蕾潔咖啡廳',date:'11/11 · 神保町',desc:'走訪粉絲推測的蕾潔篇場景，咖啡廳與中野百老匯排在這天；營業狀態請再確認。',id:'d3'},
{x:510,y:110,icon:'🚢',name:'松島海岸',date:'11/12 · 宮城',desc:'搭新幹線到仙台，再換乘仙石線探索松島海灣。記得去回程都確認指定席與接駁。',id:'d4'},
{x:695,y:115,icon:'♨️',name:'彌彥溫泉',date:'11/13 · 新潟',desc:'彌彥神社、紅葉與溫泉。回程留意普通列車與燕三條新幹線的接續時間。',id:'d5'},
{x:125,y:335,icon:'🏯',name:'川越小江戶',date:'11/14 · 埼玉',desc:'方案 A 川越加展覽；方案 B 川越慢遊。兩個方案仍可依心情選擇。',id:'d6'},
{x:310,y:335,icon:'⛰️',name:'山寺',date:'11/15 · 山形',desc:'登石階看古寺和山谷；穿好走的運動鞋，雨後留心濕滑。回程是否到東京站領禮盒依訂單確認。',id:'d7'},
{x:500,y:335,icon:'🌰',name:'長野小布施',date:'11/16 · 長野',desc:'善光寺、北齋與栗子小鎮。回程新幹線尚未選定，長野電鐵不是 JR PASS 範圍。',id:'d8'},
{x:690,y:335,icon:'🏨',name:'上野旅宿',date:'11/9—11/18 · 東京',desc:'APA 上野御徒町站前南是這趟旅程的住宿基地；地址和入住資訊以訂房確認信為準。',id:'overview'}];
const c=document.getElementById('game'),ctx=c.getContext('2d'),dialog=document.getElementById('info'),visited=new Set(JSON.parse(localStorage.getItem('japanquest_visited')||'[]'));let player={x:400,y:245},near=null;
function paint(){ctx.fillStyle='#84ad70';ctx.fillRect(0,0,800,510);ctx.fillStyle='#dccb94';ctx.fillRect(0,205,800,100);ctx.fillRect(60,0,95,510);ctx.fillRect(355,0,90,510);ctx.fillRect(645,0,95,510);for(let i=0;i<22;i++){let x=(i*137+20)%800,y=(i*89+30)%510;ctx.fillStyle='#5b945e';ctx.fillRect(x,y,9,9)}places.forEach((p,i)=>{ctx.fillStyle=visited.has(i)?'#ffd780':'#f6e6bc';ctx.fillRect(p.x-55,p.y-45,110,90);ctx.fillStyle='#ad624b';ctx.beginPath();ctx.moveTo(p.x-65,p.y-45);ctx.lineTo(p.x,p.y-80);ctx.lineTo(p.x+65,p.y-45);ctx.fill();ctx.fillStyle='#345347';ctx.fillRect(p.x-13,p.y+15,26,30);ctx.textAlign='center';ctx.font='32px sans-serif';ctx.fillText(p.icon,p.x,p.y+7);ctx.font='bold 16px sans-serif';ctx.fillStyle='#173831';ctx.fillText(p.name,p.x,p.y+68)});ctx.fillStyle='#223b59';ctx.fillRect(player.x-11,player.y-9,22,23);ctx.fillStyle='#f5c793';ctx.fillRect(player.x-9,player.y-24,18,16);ctx.fillStyle='#332c29';ctx.fillRect(player.x-10,player.y-27,20,7);near=null;let best=90;places.forEach((p,i)=>{let d=Math.hypot(player.x-p.x,player.y-p.y);if(d<best){near=i;best=d}});document.getElementById('prompt').textContent=near===null?'走近建築，按「查看」':'附近：'+places[near].name+'，按「查看」';document.getElementById('progress').textContent='已探索 '+visited.size+' / '+places.length}
function open(i){if(i===null)return;const p=places[i];visited.add(i);try{localStorage.setItem('japanquest_visited',JSON.stringify([...visited]))}catch(e){}document.getElementById('date').textContent=p.date;document.getElementById('title').textContent=p.icon+' '+p.name;document.getElementById('description').textContent=p.desc;document.getElementById('link').href='./index.html#'+p.id;dialog.showModal();paint()}
function move(x,y){if(dialog.open)return;player.x=Math.max(15,Math.min(785,player.x+x*20));player.y=Math.max(30,Math.min(485,player.y+y*20));paint()}
document.querySelectorAll('[data-x]').forEach(b=>{let timer;b.addEventListener('pointerdown',e=>{e.preventDefault();move(+b.dataset.x,+b.dataset.y);timer=setInterval(()=>move(+b.dataset.x,+b.dataset.y),110);b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,()=>clearInterval(timer)))});
document.addEventListener('keydown',e=>{let k=e.key.toLowerCase(),m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];if(m){e.preventDefault();move(...m)}if((k===' '||k==='enter')&&!dialog.open){e.preventDefault();open(near)}});document.getElementById('interact').onclick=()=>open(near);document.getElementById('close').onclick=()=>dialog.close();places.forEach((p,i)=>{let b=document.createElement('button');b.textContent=p.icon+' '+p.name;b.onclick=()=>open(i);document.getElementById('dest').appendChild(b)});paint();
</script></body></html>
